<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);

@media (prefers-color-scheme:dark){:root{--bg:#15130f;--card:#201d18;--text:#f3eee6;--muted:#a39d92;--accent:#ff5c93;--border:#34302a;--chip:#2b2721}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari","Noto Sans Bengali","Noto Sans Telugu","Noto Sans Tamil","Noto Sans Gujarati","Noto Sans Kannada","Noto Sans Oriya","Noto Sans Malayalam","Noto Sans Gurmukhi","Noto Naskh Arabic",sans-serif;line-height:1.6}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.6rem;margin:8px 0 4px}
.sub{color:var(--muted);margin:0 0 16px}
label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:4px}
select,input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:1rem;font-family:inherit;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{border:1px solid var(--border);background:var(--chip);color:var(--text);padding:8px 14px;border-radius:999px;font-size:.95rem;cursor:pointer;font-family:inherit}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.go{width:100%;padding:14px;border:0;border-radius:14px;background:var(--accent);color:#fff;font-size:1.05rem;font-weight:600;cursor:pointer;margin-bottom:20px;font-family:inherit}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px}
.tag{font-size:.75rem;color:var(--muted);margin:10px 0 2px}
.hook{font-size:1.1rem;font-weight:600;margin:0}
.card p{margin:0}
.hash{color:var(--accent);word-break:break-word;direction:ltr;text-align:start}
.acts{display:flex;gap:8px;margin-top:12px}
.acts button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--chip);color:var(--text);cursor:pointer;font-size:.9rem;font-family:inherit}
h2{font-size:1.1rem;margin:28px 0 10px}
.empty{color:var(--muted)}
</style>

or:{ui:["🎬 ରିଲ୍ ଆଇଡିଆ ଜେନେରେଟର୍","ପ୍ରତିଦିନ ୫ଟି ନୂଆ ରିଲ୍ ଆଇଡିଆ: ହୁକ୍, ଫର୍ମାଟ୍, କ୍ୟାପସନ୍ ଓ ହ୍ୟାସଟାଗ୍। ମାଗଣା ଓ ଅଫଲାଇନ୍।","ଆପଣଙ୍କ ଟପିକ୍ ଲେଖନ୍ତୁ (ଇଚ୍ଛାଧୀନ), ଯଥା: protein, UPSC, momos","✨ ୫ଟି ନୂଆ ଆଇଡିଆ ଦିଅ","ହୁକ୍","ଫର୍ମାଟ୍","ହ୍ୟାସଟାଗ୍","ପୋଷ୍ଟ କରିବାର ସର୍ବୋତ୍ତମ ସମୟ","📋 କ୍ୟାପସନ୍ କପି","✅ କପି ହେଲା","⭐ ସେଭ୍","🗑 ହଟାନ୍ତୁ","⭐ ସେଭ୍ ହୋଇଥିବା ଆଇଡିଆ","ଏପର୍ଯ୍ୟନ୍ତ କୌଣସି ସେଭ୍ ଆଇଡିଆ ନାହିଁ।","ଭାଷା"],

/* ---------- State ---------- */
const $=id=>document.getElementById(id);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>[...a].sort(()=>Math.random()-.5);
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
let lang="hn",nicheIdx=0,ideas=[],saved=[];
try{const s=JSON.parse(localStorage.getItem("reelPrefs")||"{}");if(T[s.lang])lang=s.lang;if(s.n>=0&&s.n<NICHES.length)nicheIdx=s.n;saved=JSON.parse(localStorage.getItem("reelSaved")||"[]")}catch(e){}
const prefs=()=>{try{localStorage.setItem("reelPrefs",JSON.stringify({lang,n:nicheIdx}))}catch(e){}};
const persist=()=>{try{localStorage.setItem("reelSaved",JSON.stringify(saved))}catch(e){}};
const U=i=>T[lang].ui[i];

/* ---------- UI ---------- */
function applyLang(){
  document.documentElement.lang=lang==="hn"?"hi-Latn":lang;
  document.documentElement.dir=lang==="ur"?"rtl":"ltr";
  document.title=U(0).replace("🎬 ","");
  $("title").textContent=U(0);$("sub").textContent=U(1);$("topic").placeholder=U(2);
  $("go").textContent=U(3);$("langLabel").textContent=T.en.ui[14]+" / "+U(14);$("savedTitle").textContent=U(12);
  drawChips();
}
function drawChips(){
  const c=$("chips");c.innerHTML="";
  NICHES.forEach((n,i)=>{const b=document.createElement("button");b.className="chip"+(i===nicheIdx?" on":"");b.textContent=T[lang].n[i];b.onclick=()=>{nicheIdx=i;prefs();drawChips()};c.appendChild(b)});
}
function gen(){
  const custom=$("topic").value.trim(),n=NICHES[nicheIdx],d=T[lang];
  const hooks=shuffle(d.h).slice(0,5),topics=shuffle(n.t);
  ideas=hooks.map((h,i)=>{const t=custom||topics[i%topics.length];
    const hook=h.split("{t}").join(t);
    const tags=[...shuffle(n.h).slice(0,4),LTAG[lang],pick(["reels","reelsindia","viral","trending","explorepage"])].map(x=>"#"+x).join(" ");
    return{hook,format:pick(d.f),time:pick(TIMES),caption:hook+"\n\n"+pick(d.c),tags,
      L:{hook:U(4),fmt:U(5),tags:U(6),time:U(7),copy:U(8),copied:U(9),save:U(10),del:U(11)}}});
  render();
}
function card(x,i,isSaved){
  return `<div class="card"><p class="tag">${x.L.hook}</p><p class="hook">${esc(x.hook)}</p>
  <p class="tag">${x.L.fmt}</p><p>${esc(x.format)}</p>
  <p class="tag">${x.L.time}</p><p>⏰ ${x.time}</p>
  <p class="tag">${x.L.tags}</p><p class="hash">${esc(x.tags)}</p>
  <div class="acts"><button data-a="copy" data-i="${i}" data-s="${isSaved?1:0}">${x.L.copy}</button>
  <button data-a="${isSaved?"del":"save"}" data-i="${i}">${isSaved?x.L.del:x.L.save}</button></div></div>`;
}
function render(){
  $("out").innerHTML=ideas.map((x,i)=>card(x,i,false)).join("");
  $("saved").innerHTML=saved.length?saved.map((x,i)=>card(x,i,true)).join(""):`<p class="empty">${U(13)}</p>`;
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button[data-a]");if(!b)return;
  const i=+b.dataset.i,a=b.dataset.a,list=b.dataset.s==="1"?saved:ideas;
  if(a==="copy"){const x=list[i],t=x.caption+"\n\n"+x.tags;
    (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{b.textContent=x.L.copied}).catch(()=>{b.textContent="Select & copy"})}
  if(a==="save"){saved.unshift(ideas[i]);persist();render()}
  if(a==="del"){saved.splice(i,1);persist();render()}
});
$("lang").innerHTML=LANGS.map(([k,n])=>`<option value="${k}">${n}</option>`).join("");
$("lang").value=lang;
$("lang").onchange=e=>{lang=e.target.value;prefs();applyLang();gen()};
$("go").onclick=gen;
applyLang();gen();
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
</script>
